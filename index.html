<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Bot Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background:
                radial-gradient(circle at 20% 20%, rgba(30, 100, 200, 0.25), transparent 30%),
                linear-gradient(135deg, #020617, #071a38, #0b2d55);
            overflow-x: hidden;
        }

        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(circle, white 1px, transparent 1px),
                radial-gradient(circle, rgba(255,255,255,0.7) 1px, transparent 1px);
            background-size: 100px 100px, 160px 160px;
            background-position: 10px 20px, 50px 80px;
            opacity: 0.35;
        }

        .navbar {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: rgba(2, 6, 23, 0.65);
            backdrop-filter: blur(15px);
            position: relative;
            z-index: 2;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .theme-button,
        .login-button {
            border: none;
            border-radius: 10px;
            padding: 11px 18px;
            cursor: pointer;
            color: white;
            background: rgba(255,255,255,0.08);
            transition: 0.2s;
        }

        .theme-button:hover,
        .login-button:hover {
            background: rgba(255,255,255,0.16);
        }

        .login-button {
            background: #5865F2;
        }

        .hero {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        .hero-content {
            max-width: 800px;
        }

        .badge {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(88,101,242,0.15);
            border: 1px solid rgba(88,101,242,0.35);
            color: #b7c0ff;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(42px, 7vw, 76px);
            line-height: 1.05;
            margin-bottom: 25px;
        }

        .gradient-text {
            background: linear-gradient(90deg, #ffffff, #7db7ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            font-size: 18px;
            line-height: 1.7;
            color: #b7c3d6;
            max-width: 650px;
            margin: 0 auto 35px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .primary-button,
        .secondary-button {
            padding: 14px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        .primary-button {
            background: #5865F2;
            color: white;
        }

        .secondary-button {
            background: rgba(255,255,255,0.08);
            color: white;
            border: 1px solid rgba(255,255,255,0.12);
        }

        .primary-button:hover,
        .secondary-button:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <div class="stars"></div>

    <nav class="navbar">
        <div class="logo">🌌 PixelBot</div>

        <div class="nav-right">
            <button class="theme-button" onclick="toggleTheme()">🌙</button>
            <button class="login-button">Login with Discord</button>
        </div>
    </nav>

    <main class="hero">
        <div class="hero-content">

            <div class="badge">
                ✦ The ultimate Discord bot dashboard
            </div>

            <h1>
                Manage your server
                <span class="gradient-text">your way.</span>
            </h1>

            <p class="description">
                A powerful and professional dashboard for managing
                your Discord server, bot settings, moderation,
                leveling and premium features.
            </p>

            <div class="buttons">
                <a href="#" class="primary-button">
                    Add to Discord
                </a>

                <a href="#" class="secondary-button">
                    Open Dashboard
                </a>
            </div>

        </div>
    </main>

    <script>
        function toggleTheme() {
            alert("Light and dark themes will be added in the next step!");
        }
    </script>

</body>
</html>
